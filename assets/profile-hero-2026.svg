<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="0.55" stop-color="#10161D"/>
      <stop offset="1" stop-color="#0D1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="0" x2="1080" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E15D2D"/>
      <stop offset="0.5" stop-color="#F29A66"/>
      <stop offset="1" stop-color="#4A9A78"/>
    </linearGradient>
    <radialGradient id="glowOrange" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1010 70) rotate(145) scale(310 220)">
      <stop stop-color="#E15D2D" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#E15D2D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(115 390) rotate(-35) scale(300 190)">
      <stop stop-color="#1F5B46" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1F5B46" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#8B949E" stroke-opacity="0.055"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="26" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="26" fill="url(#glowOrange)"/>
  <rect width="1200" height="420" rx="26" fill="url(#glowGreen)"/>
  <rect x="1" y="1" width="1198" height="418" rx="25" stroke="#30363D"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="86" y="86" fill="#8B949E" font-size="18" font-weight="650" letter-spacing="3">DANIELCODE.</text>

    <text x="86" y="168" fill="#F0F6FC" font-size="50" font-weight="750" letter-spacing="-1.5">Daniel García Ortega</text>
    <text x="86" y="213" fill="#C9D1D9" font-size="24" font-weight="550">Full-Stack Developer · Product Builder</text>

    <text x="86" y="277" fill="#8B949E" font-size="20">Building useful web products from idea to production.</text>

    <g transform="translate(86 322)">
      <circle cx="8" cy="8" r="8" fill="#3FB950" opacity="0.18">
        <animate attributeName="r" values="8;15;8" dur="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.22;0;0.22" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="8" cy="8" r="4.5" fill="#3FB950"/>
      <text x="24" y="14" fill="#8B949E" font-size="17">Granada, Spain · Building in public</text>
    </g>

    <g transform="translate(895 278)">
      <rect width="218" height="54" rx="27" fill="#161B22" stroke="#30363D"/>
      <circle cx="27" cy="27" r="5" fill="#E15D2D"/>
      <text x="45" y="34" fill="#C9D1D9" font-size="16" font-weight="650">PRODUCT / CODE</text>
    </g>
  </g>

  <g opacity="0.9">
    <circle cx="1014" cy="126" r="44" stroke="#E15D2D" stroke-opacity="0.26" stroke-width="1.5"/>
    <circle cx="1014" cy="126" r="72" stroke="#4A9A78" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="5 9">
      <animateTransform attributeName="transform" type="rotate" from="0 1014 126" to="360 1014 126" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1014" cy="126" r="5" fill="#F29A66"/>
    <circle cx="1084" cy="126" r="4" fill="#4A9A78">
      <animateTransform attributeName="transform" type="rotate" from="0 1014 126" to="360 1014 126" dur="9s" repeatCount="indefinite"/>
    </circle>
    <path d="M956 126H1072" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  </g>

  <rect x="86" y="388" width="1028" height="2" rx="1" fill="#21262D"/>
  <rect x="86" y="388" width="230" height="2" rx="1" fill="url(#accent)">
    <animate attributeName="x" values="86;884;86" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="width" values="230;140;230" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>